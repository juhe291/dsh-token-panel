# dsh-token-panel bundle patch: mounts the token panel plugin into the host
# composition of a dsh profile. The plugin exposes two HTTP routes
# (`/plugins/dsh-token-panel/snapshot` for live usage and
# `/plugins/dsh-token-panel/stats` for durable per-day/per-month
# statistics); the browser HUD polls them and renders the dashboard.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command pnpm-installs the package into the profile
# and reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: token-panel
      name: dsh-token-panel
      config:
        # Poll cadence hint consumed by the browser panel (ms).
        pollInterval: 1500
        # Pricing mode: 'flat' uses the flat table (official until 2026-08-17).
        # Switch to 'peak-offpeak' after 2026-08-17 when the peak/off-peak
        # schedule (Beijing 9-12 & 14-18) takes effect.
        priceMode: flat
        # Global fallback prices in CNY per 1M tokens (used for models not
        # listed in modelPrices; defaults = deepseek-v4-flash table).
        pricePerMInput: 1
        pricePerMCacheRead: 0.02
        pricePerMOutput: 2
        # Peak-period fallback prices (Beijing 9-12 & 14-18).
        pricePeakInput: 3
        pricePeakCacheRead: 0.1
        pricePeakOutput: 9
        # Off-peak fallback prices.
        priceOffpeakInput: 1.5
        priceOffpeakCacheRead: 0.05
        priceOffpeakOutput: 4.5
        # Per-model price tables (CNY per 1M tokens). Built-in defaults cover
        # deepseek-v4-flash and deepseek-v4-pro (flat + 2026-08-17 peak tiers);
        # override or extend here. Costs are display-only estimates.
        modelPrices:
          deepseek-v4-flash:
            flat:    { hit: 0.02, miss: 1,   output: 2 }
            peak:    { hit: 0.10, miss: 3,   output: 9 }
            offpeak: { hit: 0.05, miss: 1.5, output: 4.5 }
          deepseek-v4-pro:
            flat:    { hit: 0.025, miss: 3,  output: 6 }
            peak:    { hit: 0.30,  miss: 9,  output: 27 }
            offpeak: { hit: 0.15,  miss: 4.5, output: 13.5 }
        # Monthly budget in CNY (0 = meter disabled).
        budgetMonthly: 0
        # Durable per-day usage log directory. Defaults to
        # ~/.dsh/cache/dsh-token-panel when omitted.
        # dataDir: C:\Users\q1684\.dsh\cache\dsh-token-panel
