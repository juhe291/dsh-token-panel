name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json's "packageManager" field
        # (pnpm@11.7.0), keeping CI identical to the local toolchain so
        # lockfile settings (autoInstallPeers etc.) always match.

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 uses node:sqlite (Node >= 22.5), so Node 20 is too old.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run verify

      # Fallback auth: if an npm automation token exists as the NPM_TOKEN
      # repository secret, configure npm to use it. Without it, publishing
      # falls back to Trusted Publisher (OIDC) — npmjs verifies the GitHub
      # workflow identity configured on the package's settings page.
      - name: Configure npm auth
        if: secrets.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish
        run: npm publish --provenance --access public

      - name: Cleanup npmrc
        if: secrets.NPM_TOKEN != ''
        run: rm -f ~/.npmrc
