name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json's "packageManager" field
        # (pnpm@11.7.0), keeping CI identical to the local toolchain so
        # lockfile settings (autoInstallPeers etc.) always match.

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 uses node:sqlite (Node >= 22.5), so Node 20 is too old.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run verify

      # Fallback auth: if an npm automation token exists as the NPM_TOKEN
      # repository secret, configure npm to use it. Without it, publishing
      # falls back to Trusted Publisher (OIDC) — npmjs verifies the GitHub
      # workflow identity configured on the package's settings page.
      # (The secret is passed via env, not `if:` — secrets in `if`
      # conditions are a known workflow-evaluation footgun.)
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          fi

      - name: Publish
        run: npm publish --provenance --access public

      - name: Cleanup npmrc
        run: rm -f ~/.npmrc
